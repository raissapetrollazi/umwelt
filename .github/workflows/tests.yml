name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Umwelt
        run: python -m pip install --editable '.[calms21]'

      - name: Run unit tests
        run: python -m unittest discover --start-directory tests

  research-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development checks
        run: python -m pip install --editable '.[dev,calms21]'

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check spatial and world typing
        run: >-
          mypy
          src/umwelt/calms21.py
          src/umwelt/calms21_audit.py
          src/umwelt/dyad.py
          src/umwelt/social_model.py
          src/umwelt/spatial_config.py
          src/umwelt/spatial_evaluation.py
          src/umwelt/spatial_execution.py
          src/umwelt/spatial_lab.py
          src/umwelt/spatial_model.py
          src/umwelt/spatial_protocol.py
          src/umwelt/spatial_reporting.py
          src/umwelt/world.py
          src/umwelt/world_evaluation.py
          src/umwelt/world_config.py
          src/umwelt/world_execution.py
          src/umwelt/world_lab.py
          src/umwelt/world_model.py
          src/umwelt/world_protocol.py
          src/umwelt/world_recordings.py
          src/umwelt/world_reporting.py
